<form [formGroup]="emailForm" (ngSubmit)="onSubmit()"
	class="flex flex-column md:flex-row justify-content-center align-items-center row-12 px-4 md:px-8">
	<div class="flex flex-column col-12 md:col-6 px-4">
		<div>
			<h2 class="text-5xl font-light">Hablemos de tu proyecto</h2>
			<h4 class="text-2xl font-light"><span>¿Tienes un proyecto en mente?</span>
				Cuéntame más sobre él y te ayudaré a
				hacerlo realidad.</h4>
		</div>
	</div>
	<div class="flex flex-column gap-3 col-12 md:col-6">
		<div class="flex flex-column gap-1">
			<label class="text-lg" for="name">Nombre: </label>
			<input type="text" id="name" formControlName="name"
				placeholder="Nombre Contacto"
				[class.input-invalid]="isValidField('name')"
				class="p-3 border-round-lg outline-none text-base">

			@if (isValidField('name')) {
			<span class="field-error">{{ getFieldError('name') }}</span>
			}
		</div>
		<div class="flex flex-column gap-1">
			<label class="text-lg" for="email">Correo Electronico: </label>
			<input type="text" id="email" formControlName="email"
				placeholder="Correo Electronico"
				[class.input-invalid]="isValidField('email')"
				class="p-3 border-round-lg outline-none text-base">
			@if (isValidField('email')) {
			<span class="field-error">{{ getFieldError('email') }}</span>
			}
		</div>
		<textarea class="msg border-round-lg p-3 text-base" formControlName="message"
			name="message" id cols="30" rows="10"
			[class.input-invalid]="isValidField('message')"
			placeholder="Dejame un mensaje..."></textarea>

		@if (isValidField('message')) {
		<span class="field-error">{{ getFieldError('message') }}</span>
		}

		<p-toast position="bottom-right"></p-toast>

		<input class="btn-submit border-round-lg text-lg" type="submit"
			[disabled]="sending" [value]="sending ? 'Enviando...' : 'Enviar'">

	</div>
</form>
