 <div
	class="flex flex-column justify-content-center align-items-center h-full px-4 md:px-0 pb-6">
	<div
		class="flex flex-column justify-content-center align-items-center w-full title-container text-center">
		<h2 class="font-light md:text-4xl">Proyectos Recientes</h2>
		<p class="md:text-xl">Estos son los proyectos en los que he trabajado. Cada
			proyecto incluye una breve descripción del mismo.</p>
	</div>
	<div
		class="flex flex-wrap justify-content-center py-5 gap-4 w-full">
		@for (project of projects; track project.title) {
		<div
			class="card flex flex-column justify-content-between border-round-2xl p-4 gap-2 w-10 md:w-3">
			<div class="flex justify-content-center align-items-center project-image-wrapper">
				<img class="shadow-8" [src]="project.image" [alt]="project.title" width="200">
			</div>
			<div class="flex flex-column gap-1 text-center flex-grow-1">
				<h3 class="font-light m-0">{{ project.title }}</h3>
				<p class="font-light m-0">{{ project.description }}</p>
			</div>

			<a
				class="flex justify-content-center align-items-center gap-2 px-6 py-2 border-round text-white no-underline mt-2"
				[href]="project.repoUrl" target="_blank" rel="noopener"><i
					class="pi pi-github
				"></i>Ver Código</a>
		</div>
		}
	</div>

	<a routerLink="/portfolio" class="flex justify-content-center align-items-center gap-2 px-6 py-3 border-round-md text-white no-underline see-all-link">
		Ver todo el portafolio
		<i class="pi pi-arrow-right"></i>
	</a>
</div>
