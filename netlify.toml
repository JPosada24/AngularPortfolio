[build]
  command = "npm run build"
  publish = "dist/portfolio_project_angular/browser"
  functions = "netlify/functions"

# Note: a /api/contact -> /.netlify/functions/contact redirect was tried here
# but Netlify's Angular SSR framework detection swallows custom redirects for
# app-like paths. The client calls /.netlify/functions/contact directly
# instead (see contact-form.component.ts), which always works.
